services:
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/miniwsa
      DB_USERNAME: miniwsa
      DB_PASSWORD: ${DB_PASSWORD:-miniwsa}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: miniwsa
      POSTGRES_USER: miniwsa
      POSTGRES_PASSWORD: ${DB_PASSWORD:-miniwsa}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniwsa -d miniwsa"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
